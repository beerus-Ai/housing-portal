server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: false
        max-age: 8h
  error:
    include-message: never

spring:
  application:
    name: portal-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    # Local: H2 file database in PostgreSQL mode. Override the file with DB_FILE (path without extension).
    url: jdbc:h2:file:${DB_FILE:./data/portal};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=KEY,VALUE
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      resolve-lazily: true      # parse only after the permission check (see RequestController)
      max-file-size: 5MB
      max-request-size: 6MB
  main:
    banner-mode: "off"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

portal:
  production: false
  upload-dir: ${UPLOAD_DIR:./uploads}
  admin-email: ${ADMIN_EMAIL:admin@society.test}
  admin-password: ${ADMIN_PASSWORD:Admin@1234}
  session-secret: ${SESSION_SECRET:}
